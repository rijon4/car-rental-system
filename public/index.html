<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoClip Car Rental System</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- LOGIN SCREEN -->
  <div id="login-screen" class="login-screen">
    <div class="login-card">
      <div class="login-logo">🚗</div>
      <h1>AutoClip</h1>
      <p class="login-sub">Car Rental Management System</p>
      <form id="login-form">
        <label>Username</label>
        <input type="text" id="login-username" placeholder="admin" required>
        <label>Password</label>
        <input type="password" id="login-password" placeholder="••••••••" required>
        <button type="submit" class="btn btn-primary btn-block">Sign In</button>
      </form>
      <p class="login-error" id="login-error"></p>
      <p class="login-hint">Demo credentials: <b>admin</b> / <b>admin123</b></p>
    </div>
  </div>

  <!-- APP SHELL -->
  <div id="app-shell" class="app-shell" style="display:none;">
    <aside class="sidebar">
      <div class="sidebar-brand">🚗 <span>AutoClip</span></div>
      <nav>
        <button class="nav-item active" data-view="dashboard"><span>📊 Dashboard</span></button>
        <button class="nav-item" data-view="vehicles"><span>🚙 Fleet</span></button>
        <button class="nav-item" data-view="customers"><span>👤 Customers</span></button>
        <button class="nav-item" data-view="rentals"><span>📅 Rentals</span></button>
        <button class="nav-item" data-view="reports"><span>💰 Reports</span></button>
      </nav>
      <div class="sidebar-footer">v1.0.0</div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="topbar-title" id="topbar-title">Dashboard</div>
        <div class="topbar-user">
          <span id="topbar-username"></span>
          <button class="btn btn-outline" id="logout-btn">Logout</button>
        </div>
      </header>
      <div class="content" id="content"></div>
    </main>
  </div>

  <!-- VEHICLE MODAL -->
  <div class="modal-overlay" id="vehicle-modal" style="display:none;">
    <div class="modal">
      <h2 id="vehicle-modal-title">Add Vehicle</h2>
      <form id="vehicle-form">
        <div class="form-grid">
          <div><label>Make *</label><input id="v-make" required></div>
          <div><label>Model *</label><input id="v-model" required></div>
          <div><label>Year *</label><input id="v-year" type="number" required></div>
          <div><label>Color</label><input id="v-color"></div>
          <div><label>License Plate *</label><input id="v-plate" required></div>
          <div><label>VIN *</label><input id="v-vin" required></div>
          <div><label>Fuel Type</label><select id="v-fuel"><option>Petrol</option><option>Diesel</option><option>Hybrid</option><option>Electric</option></select></div>
          <div><label>Transmission</label><select id="v-trans"><option>Automatic</option><option>Manual</option></select></div>
          <div><label>Seats</label><input id="v-seats" type="number" min="1" value="5"></div>
          <div><label>Daily Rate ($) *</label><input id="v-rate" type="number" min="1" step="0.01" required></div>
          <div><label>Status</label><select id="v-status"><option value="available">Available</option><option value="rented">Rented</option><option value="maintenance">Maintenance</option><option value="retired">Retired</option></select></div>
          <div><label>Mileage (km)</label><input id="v-mileage" type="number" min="0"></div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline" onclick="document.getElementById('vehicle-modal').style.display='none'">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Vehicle</button>
        </div>
      </form>
    </div>
  </div>

  <!-- CUSTOMER MODAL -->
  <div class="modal-overlay" id="customer-modal" style="display:none;">
    <div class="modal">
      <h2 id="customer-modal-title">Add Customer</h2>
      <form id="customer-form">
        <div class="form-grid">
          <div><label>First Name *</label><input id="cu-first" required></div>
          <div><label>Last Name *</label><input id="cu-last" required></div>
          <div><label>Email *</label><input id="cu-email" type="email" required></div>
          <div><label>Phone *</label><input id="cu-phone" required></div>
          <div><label>License Number *</label><input id="cu-lic" required></div>
          <div><label>License Expiry *</label><input id="cu-exp" type="date" required></div>
          <div><label>License Class</label><select id="cu-class"><option value="A">A</option><option value="B">B</option><option value="C">C</option></select></div>
          <div><label>Date of Birth</label><input id="cu-dob" type="date"></div>
          <div><label>Driving Years</label><input id="cu-drv" type="number" min="0"></div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline" onclick="document.getElementById('customer-modal').style.display='none'">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Customer</button>
        </div>
      </form>
    </div>
  </div>

  <!-- RENTAL MODAL -->
  <div class="modal-overlay" id="rental-modal" style="display:none;">
    <div class="modal">
      <h2>New Rental</h2>
      <form id="rental-form">
        <div class="form-grid">
          <div class="full"><label>Vehicle (available only) *</label><select id="rent-vehicle" required></select></div>
          <div class="full"><label>Customer *</label><select id="rent-customer" required></select></div>
          <div><label>Start Date *</label><input id="rent-start" type="date" required></div>
          <div><label>End Date *</label><input id="rent-end" type="date" required></div>
          <div><label>Pickup Location</label><input id="rent-pickup" value="Downtown Office"></div>
          <div><label>Drop-off Location</label><input id="rent-dropoff" value="Downtown Office"></div>
          <div class="full"><label>Discount (%)</label><input id="rent-discount" type="number" min="0" max="90" step="0.5" value="0"></div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline" onclick="document.getElementById('rental-modal').style.display='none'">Cancel</button>
          <button type="submit" class="btn btn-primary">Create Rental</button>
        </div>
      </form>
    </div>
  </div>

  <!-- CHECKOUT MODAL -->
  <div class="modal-overlay" id="checkout-modal" style="display:none;">
    <div class="modal">
      <h2>Checkout / Check-in</h2>
      <form id="checkout-form">
        <p id="co-info" class="muted mb"></p>
        <div><label>Odometer (km)</label><input id="co-checkin" type="number" min="0"></div>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline" onclick="document.getElementById('checkout-modal').style.display='none'">Cancel</button>
          <button type="submit" class="btn btn-primary">Confirm Check-out</button>
        </div>
      </form>
    </div>
  </div>

  <!-- RETURN MODAL -->
  <div class="modal-overlay" id="return-modal" style="display:none;">
    <div class="modal">
      <h2>Return Vehicle</h2>
      <form id="return-form">
        <div class="form-grid">
          <div><label>Actual Return Date</label><input id="ret-date" type="date"></div>
          <div><label>Actual Return Odometer (km)</label><input id="ret-km" type="number" min="0"></div>
          <div class="full">
            <label>Damage Charges</label>
            <div id="ret-damages"></div>
            <button type="button" class="btn btn-outline btn-sm mt" id="add-damage">+ Add Damage</button>
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline" onclick="document.getElementById('return-modal').style.display='none'">Cancel</button>
          <button type="submit" class="btn btn-success">Confirm Return</button>
        </div>
      </form>
    </div>
  </div>

  <!-- PAYMENT MODAL -->
  <div class="modal-overlay" id="pay-modal" style="display:none;">
    <div class="modal">
      <h2>Record Payment</h2>
      <form id="pay-form">
        <p id="pay-info" class="muted mb"></p>
        <div class="form-grid">
          <div><label>Amount ($) *</label><input id="pay-amount" type="number" min="0.01" step="0.01" required></div>
          <div><label>Method</label><select id="pay-method"><option value="credit_card">Credit Card</option><option value="debit_card">Debit Card</option><option value="cash">Cash</option><option value="bank_transfer">Bank Transfer</option></select></div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline" onclick="document.getElementById('pay-modal').style.display='none'">Cancel</button>
          <button type="submit" class="btn btn-success">Record Payment</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="/js/app.js"></script>
</body>
</html>
